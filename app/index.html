<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Meals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Family Meals app: what the daily email says, on the phone. Built by `meals.py site`; data is embedded below. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --line:#dde3da; --fg:#1d261f; --muted:#5d6b60;
  --accent:#2f5d3a; --accent-ink:#ffffff; --warn:#a35f00; --warn-bg:#fbefd5; --ok:#2f7d4a; --ok-bg:#e3f1e7; --chip:#eef1ec; --kid:#3f4f8c; --kid-ink:#ffffff;
  --bf:#c27a12; --lu:#2f7d4a; --sn:#a0522d; --di:#3f4f8c;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121713; --surface:#1a211c; --line:#2c362e; --fg:#e6ece6; --muted:#9aa89d;
  --accent:#7fbf8d; --accent-ink:#0f1a12; --warn:#e6b955; --warn-bg:#3a2f14; --ok:#7fcf95; --ok-bg:#1d3324; --chip:#232b25; --kid:#9aa8e6; --kid-ink:#10142a;
  --bf:#e0a24a; --lu:#7fcf95; --sn:#d98c63; --di:#9aa8e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1a211c; --line:#2c362e; --fg:#e6ece6; --muted:#9aa89d;
  --accent:#7fbf8d; --accent-ink:#0f1a12; --warn:#e6b955; --warn-bg:#3a2f14; --ok:#7fcf95; --ok-bg:#1d3324; --chip:#232b25; --kid:#9aa8e6; --kid-ink:#10142a;
  --bf:#e0a24a; --lu:#7fcf95; --sn:#d98c63; --di:#9aa8e6; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{font-family:var(--f-display);font-size:22px;margin:0}
.fresh{font-size:12px;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip[hidden]{display:none}
.daybtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:6px 10px;font:500 13px var(--f-body);cursor:pointer;text-align:center;line-height:1.2;min-width:54px}
.daybtn small{display:block;font-size:11px;color:var(--muted)}
.daybtn[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daybtn[aria-current="true"] small{color:var(--accent-ink);opacity:.85}
.daybtn.today{border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(88px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h2{font-family:var(--f-display);font-size:21px;margin:0;text-wrap:balance}
h3{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0}
.lede{color:var(--muted);margin:0;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.meal-name{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:4px 0 2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dish{font-weight:600}
.note{font-weight:400;color:var(--muted);font-size:13px}
.who{font-size:12px;color:var(--muted)}
.qty{text-align:right;font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.measure{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.glance{display:grid;gap:8px}
.g{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px}
.bar{border-radius:2px}
.sides{font-size:13px;color:var(--muted)}
ul.prep{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.prep li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
ul.prep li::before{content:"☐";color:var(--di);font-size:17px;line-height:1.3}
details.meal{border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.meal>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:grid;gap:2px}
details.meal>summary::-webkit-details-marker{display:none}
details.meal>summary .count{color:var(--muted);font-weight:400;font-size:13px}
details.meal[open]>summary{border-bottom:1px solid var(--line)}
.rcard{padding:12px 14px;border-bottom:1px solid var(--line)}
.rcard:last-child{border-bottom:0}
.rname{font-weight:700;font-size:16px}
.make b{font-size:17px}
.ings{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 6px}
.ing{font-size:12px;font-weight:600;background:var(--chip);border-radius:999px;padding:3px 9px}
ol.steps{margin:6px 0 0;padding-left:22px}
ol.steps li{margin:3px 0}
.flag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px}
.flag.kid{background:var(--kid);color:var(--kid-ink)}
.flag.tip{background:var(--ok-bg);color:var(--ok)}
.extra{list-style:none;margin-left:-22px}
.simple{font-size:13px;color:var(--muted);margin-top:2px}
.person{padding:8px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.week{display:grid;gap:0}
.wday{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;width:100%}
.wday:last-child{border-bottom:0}
.wday .d{font-weight:700}
.wday .d small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.wday.is-today .d{color:var(--accent)}
.wl{font-size:13px;line-height:1.55}
.wl b{display:inline-block;width:16px}
.buyrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;align-items:baseline}
.buyrow:last-child{border-bottom:0}
.buyrow .box{color:var(--muted)}
.buyrow b{font-variant-numeric:tabular-nums}
.buyrow.got{color:var(--muted)}
.buyrow.got span.n{text-decoration:line-through}
.buyrow.got .box{color:var(--ok)}
.cartbtn{border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-body);padding:10px 18px;border-radius:999px;cursor:pointer;margin-top:10px}
.cartbtn[disabled]{opacity:.55;cursor:default}
.g .mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.copybtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 13px var(--f-body);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.copybtn.done{background:var(--ok-bg);color:var(--fg);border-color:transparent}
.cartstate{margin-top:10px}
.steps{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:4px;font-size:14px}
.st{display:flex;gap:8px;align-items:center}
.st .dot{width:18px;text-align:center}
.st.ok .dot{color:var(--ok)} .st.now{font-weight:700} .st.now .dot{color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.st.todo{color:var(--muted)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.st.now .dot{animation:none}}
.cartok{background:var(--ok-bg);color:var(--fg);padding:8px 10px;border-radius:10px;margin:6px 0;font-size:14px}
.cartbad{background:var(--warn-bg);color:var(--fg);padding:8px 10px;border-radius:10px;margin:6px 0;font-size:14px}
.cartlink{color:var(--accent);font-weight:700;text-decoration:none}
.gtitle{font-weight:700;margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;color:var(--muted);font:600 12px var(--f-body);padding:8px 4px 10px;cursor:pointer;display:grid;justify-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.lock{max-width:420px;margin:40px auto 0}
.lock input{width:100%;font:16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.lock button{border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-body);padding:10px 18px;border-radius:999px;cursor:pointer;justify-self:start}
.err{color:var(--warn);font-size:13px;min-height:18px}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<script>
const EMPTY = {days:[],weeks:[],staples:null,generated:""};
let D = JSON.parse(document.getElementById("data").textContent);
const ENC = JSON.parse(document.getElementById("enc").textContent);
const MEAL = {breakfast:["Breakfast","var(--bf)"], lunch:["Lunch","var(--lu)"], snack:["Evening snack","var(--sn)"], dinner:["Dinner","var(--di)"]};
const ICON = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11h16M6 11c0 4 2.7 7 6 7s6-3 6-7"/><path d="M9 7c0-1 1-1.5 1-2.5M13 7c0-1 1-1.5 1-2.5"/></svg>',
  tonight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 8h14l-1.2 11H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>'};
const TABS = [["today","Today"],["tonight","Tonight"],["week","Week"],["shop","Shop"]];
function el(t,a={},...k){const n=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")n.className=v;else if(x==="text")n.textContent=v;else if(x==="html")n.innerHTML=v;else if(x.startsWith("on"))n.addEventListener(x.slice(2),v);else n.setAttribute(x,v)}k.flat().forEach(c=>c!=null&&n.append(c));return n}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function istToday(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata"}).format(new Date())}
const TODAY = istToday();
let tab = "today";
let cur = 0;
function pickToday(){const i=D.days.findIndex(d=>d.date===TODAY); if(i>=0) return i; const j=D.days.findIndex(d=>d.date>TODAY); return j>=0?j:Math.max(0,D.days.length-1);}

function rel(date){const a=new Date(TODAY+"T00:00:00Z"),b=new Date(date+"T00:00:00Z");const n=Math.round((b-a)/864e5);return n===0?"Today":n===1?"Tomorrow":n===-1?"Yesterday":null}
function fresh(){
  const f=document.getElementById("fresh"); if(!D.generated){f.textContent="";return}
  const t=new Date(D.generated); const h=(Date.now()-t)/36e5;
  f.textContent="Updated "+t.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",weekday:"short",hour:"numeric",minute:"2-digit"});
  if(h>20){f.style.color="var(--warn)"; f.textContent+=" · may be out of date";}
}
function strip(){
  const s=document.getElementById("strip"); s.textContent="";
  s.hidden = !(tab==="today");
  D.days.forEach((d,i)=>{const r=rel(d.date); const [w,dd,mm]=d.label.split(" ");
    const b=el("button",{type:"button",class:"daybtn"+(d.date===TODAY?" today":""),"aria-current":String(i===cur),onclick:()=>{cur=i;render();}},
      r||w, el("small",{text:dd+" "+mm+(d.fasting?" 🪔":"")}));
    s.append(b);});
  const a=s.querySelector('[aria-current="true"]'); if(a) a.scrollIntoView({block:"nearest",inline:"center"});
}
function tabs(){
  const t=document.getElementById("tabs"); t.textContent="";
  TABS.forEach(([k,n])=>t.append(el("button",{type:"button",class:"tab","aria-current":tab===k?"page":"false",onclick:()=>{tab=k;window.scrollTo(0,0);render();}},el("span",{html:ICON[k]}),n)));
}
function glanceCard(d,title){
  const chips=[el("span",{class:"chip",text:d.counts.cook+" things to make"}),el("span",{class:"chip",text:d.counts.sabzi+" sabzi"+(d.counts.sabzi===1?"":"s")}),
    el("span",{class:"chip",text:d.counts.grain+" roti/rice kind"+(d.counts.grain===1?"":"s")})];
  if(d.fasting) chips.unshift(el("span",{class:"chip warn",text:"🪔 Vrat day"}));
  return el("section",{class:"card"}, el("div",{}, title?el("h3",{text:title,style:"margin-bottom:4px"}):null, el("h2",{text:d.long})), el("div",{class:"chips"},chips),
    el("div",{class:"glance"}, d.glance.map(g=>el("div",{class:"g"}, el("div",{class:"bar",style:"background:"+MEAL[g.slot][1]}),
      el("div",{}, el("div",{class:"mtop"}, el("div",{class:"meal-name",style:"color:"+MEAL[g.slot][1]+";margin:0",text:MEAL[g.slot][0]}), copyBtn(d,g.slot)), el("div",{class:"dish",text:g.mains.join(" + ")}),
        g.sides.length?el("div",{class:"sides",text:"with "+g.sides.join(", ")}):null, g.vrat?el("div",{class:"sides",text:"🪔 Vrat: "+g.vrat}):null)))));
}
// ---- cook's copy: one meal as a WhatsApp-ready message (WhatsApp shows *text* in bold)
const SLOTWORD = {breakfast:"breakfast", lunch:"lunch", snack:"evening snack", dinner:"dinner"};
function cookText(d,slot){
  const [w,dd,mm]=d.label.split(" "), g=d.glance.find(x=>x.slot===slot)||{};
  const rows=(d.cook.find(m=>m.slot===slot)||{rows:[]}).rows, cards=(d.recipes.find(m=>m.slot===slot)||{cards:[]}).cards;
  const out=["🍽️ *"+MEAL[slot][0]+" · "+w+" "+dd+" "+mm+"*"];
  if(g.vrat) out.push("🪔 Vrat: "+g.vrat);
  rows.forEach((r,i)=>{
    const c=cards.find(x=>x.name===r.name), amt=(r.measure||"").split("= ")[1];
    out.push("", "*"+(i+1)+". "+r.name+"*"+(r.note?" ("+r.note+")":"")+" – "+r.total+(amt?" ("+amt+")":""));
    if(c&&c.ings.length) out.push(c.ings.join(", "));
    if(c) c.steps.filter(([k])=>k==="kid").forEach(([,t])=>out.push("👶 "+(D.kid||"Child")+": "+t));
  });
  const today="today's "+SLOTWORD[slot];
  const before=(d.morning||[]).filter(p=>p.includes(today)), tonight=slot==="dinner"?(d.prep||[]):[];
  if(before.length) out.push("", "⏰ *Pehle se*", ...before.map(p=>"• "+p));
  if(tonight.length) out.push("", "🌙 *Aaj raat ki taiyari*", ...tonight.map(p=>"• "+p));
  return out.join("\n");
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const a=el("textarea",{}); a.value=t; a.setAttribute("readonly",""); a.style.cssText="position:fixed;opacity:0";
  document.body.append(a); a.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} a.remove(); return ok;
}

function weekOf(date){return D.weeks.find(w=>w.start<=date&&date<=w.end)}
let weekSel = null;
function viewWeek(v){
  const ws=D.weeks.filter(w=>D.days.some(d=>d.date>=w.start&&d.date<=w.end));
  if(!ws.length){v.append(el("div",{class:"empty",text:"No week planned."}));return}
  if(!ws.find(w=>w.start===weekSel)) weekSel=(weekOf(TODAY)||ws[0]).start;
  const w=ws.find(x=>x.start===weekSel), days=D.days.filter(d=>d.date>=w.start&&d.date<=w.end);
  const name=x=>x.start<=TODAY&&TODAY<=x.end?"This week":x.start>TODAY&&ws.indexOf(x)===ws.findIndex(y=>y.start>TODAY)?"Next week":"Week of "+x.range.split(" to ")[0].slice(4);
  if(ws.length>1) v.append(el("div",{class:"seg",role:"group","aria-label":"Week"}, ws.map(x=>el("button",{type:"button",class:"segbtn","aria-pressed":String(x.start===weekSel),onclick:()=>{weekSel=x.start;render();},text:name(x)}))));
  v.append(el("section",{class:"card"}, el("div",{},el("h3",{text:name(w)}),el("h2",{text:w.range})),
    el("div",{class:"week"}, days.map(d=>{const [wd,dd,mm]=d.label.split(" ");
      return el("button",{type:"button",class:"wday"+(d.date===TODAY?" is-today":""),onclick:()=>{cur=D.days.indexOf(d);tab="today";window.scrollTo(0,0);render();}},
        el("div",{class:"d"}, wd+(d.fasting?" 🪔":""), el("small",{text:dd+" "+mm})),
        el("div",{class:"wl"}, d.glance.map(g=>el("div",{}, el("b",{style:"color:"+MEAL[g.slot][1],text:g.slot[0].toUpperCase()}), g.mains.join(" + ")))));})),
    el("p",{class:"lede",text:"B breakfast · L lunch · S snack · D dinner. Tap a day for quantities and recipes."})));
}
let shopSel = null;
function viewShop(v){
  const lists=[...D.weeks.filter(w=>w.end>=TODAY).map(w=>({key:"w"+w.start,name:"Week of "+w.range.split(" to ")[0].slice(4),sub:"Fresh for "+w.range+". Includes a 5% buffer.",groups:w.groups}))];
  if(D.staples) lists.push({key:"staples",name:"Staples",sub:"Buy once for the plan "+D.staples.range+". Includes a 5% buffer.",groups:D.staples.groups,check:D.staples.check});
  if(!lists.length){v.append(el("div",{class:"empty",text:"Nothing to buy yet."}));return}
  if(!lists.find(l=>l.key===shopSel)){   // weekends: next week's list is the one to shop for
    const wkend=[0,6].includes(new Date(TODAY+"T12:00:00Z").getUTCDay());
    const next=D.weeks.find(w=>w.start>TODAY);
    shopSel=(wkend&&next&&lists.find(l=>l.key==="w"+next.start))?"w"+next.start:lists[0].key;}
  const L=lists.find(l=>l.key===shopSel);
  const got=new Set(JSON.parse(get("got:"+L.key)||"[]"));
  v.append(el("div",{class:"seg",role:"group","aria-label":"Shopping list"}, lists.map(l=>el("button",{type:"button",class:"segbtn","aria-pressed":String(l.key===shopSel),onclick:()=>{shopSel=l.key;render();},text:l.name}))));
  v.append(el("section",{class:"card"}, el("p",{class:"lede",text:L.sub+" Tap an item to tick it off on this phone."}),
    ...L.groups.map(g=>el("div",{}, el("div",{class:"gtitle",text:g.title}),
      ...g.items.map(([h,n,q])=>{const id=g.title+"|"+h; const on=got.has(id);
        return el("div",{class:"buyrow"+(on?" got":""),role:"checkbox","aria-checked":String(on),tabindex:"0",
          onclick:()=>{on?got.delete(id):got.add(id);put("got:"+L.key,JSON.stringify([...got]));render();},
          onkeydown:e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();e.currentTarget.click();}}},
          el("span",{class:"box",text:on?"☑":"☐"}), el("span",{}, el("span",{class:"n",text:h}), el("span",{class:"note",text:" · "+n})), el("b",{text:q}));}))),
    L.check?el("div",{}, el("div",{class:"gtitle",text:"Check you still have"}), el("div",{class:"chips",style:"margin-top:6px"}, L.check.map(c=>el("span",{class:"chip",text:c})))):null));
  if(D.cart) v.append(cartCard(L, got));
}
// "Create Instamart cart": starts the instamart.yml workflow with the unticked items, then follows the run through
// the GitHub API (the token can read Actions) and shows each stage. The cloud fills the cart, never orders, and emails
// the summary. The last result per list is remembered on this phone.
const CART = {};            // list key -> {phase, ids, at, runId, url, stage, err, done}
function cartSave(k){ put("cart:"+k, JSON.stringify(CART[k])); }
function cartLoad(k){ if(!CART[k]){ try{ CART[k]=JSON.parse(get("cart:"+k)||"null"); }catch(e){} } return CART[k]; }
const gh = (path, opt={}) => fetch("https://api.github.com/repos/"+D.cart.repo+path, {...opt,
  headers:{"Authorization":"Bearer "+D.cart.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}});
const STAGES = [["sent","📝 List on its way"],["start","🛵 Your shopper is on it"],["fill","🥬 Hand-picking every item"],["done","🧺 Basket's ready!"]];
function hhmm(t){ return new Date(t).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
function ago(t){ const s=Math.max(0,Math.round((Date.now()-t)/1000)); return s<60? s+"s" : Math.floor(s/60)+"m "+(s%60)+"s"; }

async function cartFollow(k){
  const c=CART[k]; if(!c||c.phase!=="running"||c.following) return; c.following=true;
  try{
    for(let n=0; n<120 && c.phase==="running"; n++){            // up to ~6 minutes
      if(!c.runId){
        const r=await gh("/actions/workflows/"+D.cart.workflow+"/runs?event=workflow_dispatch&per_page=5");
        if(r.ok){ const runs=(await r.json()).workflow_runs||[];
          const mine=runs.filter(x=>Date.parse(x.created_at)>=c.at-15000).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at))[0];
          if(mine){ c.runId=mine.id; c.url=mine.html_url; } }
      } else {
        const r=await gh("/actions/runs/"+c.runId+"/jobs");
        if(r.ok){ const job=((await r.json()).jobs||[])[0];
          if(job){
            const fill=(job.steps||[]).find(x=>x.name==="Fill the Instamart cart");
            c.stage = fill&&fill.status!=="queued" ? "fill" : job.status==="in_progress"||job.status==="completed" ? "start" : "sent";
            if(job.status==="completed"){
              c.phase = job.conclusion==="success" ? "done" : "failed";
              c.done=Date.now(); if(c.phase==="done") c.stage="done";
              if(c.phase==="failed") c.err="Something went wrong while packing your basket. Nothing was ordered, and you'll get an email.";
            } } }
      }
      cartSave(k); cartPaint(k);
      if(c.phase!=="running") break;
      await new Promise(res=>setTimeout(res, 3000));
    }
    if(c.phase==="running"){ c.phase="unknown"; cartSave(k); cartPaint(k); }
  } finally { c.following=false; }
}

async function cartStart(k, kind, start, ids){
  CART[k]={phase:"running", ids, at:Date.now(), stage:"sent"}; cartSave(k); cartPaint(k);
  try{
    const r=await gh("/actions/workflows/"+D.cart.workflow+"/dispatches",{method:"POST",
      body:JSON.stringify({ref:"main",inputs:{kind,start,items:ids.join(",")}})});
    if(r.status!==204) throw new Error("GitHub said "+r.status);
    cartFollow(k);
  }catch(e){ Object.assign(CART[k],{phase:"failed", err:"Couldn't send your list. Check your connection and try again."}); cartSave(k); cartPaint(k); }
}

function cartPaint(k){
  const box=document.getElementById("cartcard"); if(!box||box.dataset.key!==k) return;
  const c=CART[k]; const body=box.querySelector(".cartstate"); body.textContent="";
  const btn=box.querySelector(".cartbtn");
  if(!c){ return; }
  const order=STAGES.map(s=>s[0]); const at=order.indexOf(c.stage);
  if(c.phase==="running"||c.phase==="done"){
    body.append(el("ol",{class:"steps"}, STAGES.map(([id,label],i)=>{
      const st = c.phase==="done"||i<at ? "ok" : i===at ? "now" : "todo";
      return el("li",{class:"st "+st}, el("span",{class:"dot",text:st==="ok"?"✓":st==="now"?"●":"○"}), label);})));
  }
  if(c.phase==="running"){
    body.append(el("p",{class:"lede",text:`${c.ids.length} items · ${ago(c.at)} · usually done in under a minute`}));
    btn.setAttribute("disabled",""); btn.textContent="Shopping…";
  } else if(c.phase==="done"){
    body.append(el("p",{class:"cartok",text:`Your basket of ${c.ids.length} item${c.ids.length===1?"":"s"} was packed at ${hhmm(c.done)}. Check your email for the bill and anything Instamart was out of.`}),
      el("p",{}, el("a",{href:"https://www.swiggy.com/instamart",class:"cartlink",text:"Open Instamart, review and order →"})));
    btn.removeAttribute("disabled"); btn.textContent="Pack the basket again";
  } else {
    body.append(el("p",{class:"cartbad",text:c.phase==="unknown"?"This is taking unusually long. Check your email, or try again.":c.err}),
      c.url?el("p",{}, el("a",{href:c.url,class:"cartlink",text:"See what went wrong →"})):null);
    btn.removeAttribute("disabled"); btn.textContent="Try again";
  }
}

function cartCard(L, got){
  const skip=new Set(D.cart.skip||[]);
  const ids=[...new Set(L.groups.flatMap(g=>g.items.filter(([h,n,q,id])=>id&&!got.has(g.title+"|"+h)&&!skip.has(id)).map(it=>it[3])))];
  const start=L.key==="staples"?D.staples.start:L.key.slice(1);
  const kind=L.key==="staples"?"staples":"week";
  const k=L.key, c=cartLoad(k);
  const btn=el("button",{type:"button",class:"cartbtn",text:`🛒 Fill my Instamart basket (${ids.length} item${ids.length===1?"":"s"})`});
  if(!ids.length) btn.setAttribute("disabled","");
  btn.addEventListener("click",()=>{
    if(CART[k]&&CART[k].phase==="running") return;
    if(!ids.length) return;
    if(!confirm(`Put ${ids.length} item${ids.length===1?"":"s"} in your Instamart cart?\n\nFirst empty the cart in the Swiggy app and close it, or the app puts its old cart back.\n\nNothing is ordered: you review and order in the Swiggy app.`)) return;
    cartStart(k, kind, start, ids);
  });
  const box=el("section",{class:"card",id:"cartcard","data-key":k}, el("h3",{text:"Shop it on Instamart"}),
    el("p",{class:"lede",text:"Struck-out items and milk are left out. Before you press: empty your Instamart cart in the Swiggy app and close it."}),
    btn, el("div",{class:"cartstate"}));
  setTimeout(()=>{ cartPaint(k); if(c&&c.phase==="running") cartFollow(k); if(c&&c.phase!=="running"&&ids.length){ /* keep last result visible; button text set by paint */ } },0);
  return box;
}
function render(){
  tabs(); strip(); fresh();
  const v=document.getElementById("view"); v.textContent="";
  if(!D.days.length){v.append(el("div",{class:"empty",text:"No plan found. The next morning run will create one."}));return}
  ({today:viewToday,tonight:viewTonight,week:viewWeek,shop:viewShop})[tab](v);
}
function applyParams(p){
  if(!p) return;
  if(["today","tonight","week","shop"].includes(p.tab)) tab=p.tab;
  if(p.date){const i=D.days.findIndex(d=>d.date===p.date); if(i>=0) cur=i;}
  if(p.week) shopSel="w"+p.week;
  if(p.list==="staples") shopSel="staples";
}
const PARAMS = {...Object.fromEntries(new URLSearchParams(location.search)), ...Object.fromEntries(new URLSearchParams(location.hash.slice(1)))};

// Encrypted copy: the data is AES-GCM encrypted with a key from the family passcode (PBKDF2-SHA256).
// The passcode comes from the link's #fragment (never sent to the server) or is typed once; this device remembers it.
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64(ENC.salt), iterations:ENC.iter}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(msg){
  document.getElementById("strip").hidden = true; document.getElementById("tabs").textContent = "";
  const v=document.getElementById("view"); v.textContent="";
  const input=el("input",{type:"password",autocomplete:"current-password",placeholder:"Family passcode","aria-label":"Family passcode"});
  const err=el("div",{class:"err","aria-live":"polite",text:msg||""});
  const go=async()=>{ if(!input.value.trim()) return; err.textContent="Opening…";
    try{ D=await decrypt(input.value.trim()); put("pc",input.value.trim()); start2(); }catch(e){ err.textContent="That passcode didn't work. Check it and try again."; } };
  input.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  v.append(el("section",{class:"card lock"}, el("h2",{text:"Family Meals"}),
    el("p",{class:"lede",text:"Enter the family passcode once. This device will remember it. It's in every Family Meals email link."}),
    input, el("button",{type:"button",onclick:go,text:"Open"}), err));
  input.focus();
}
function start2(){ D = D || EMPTY; cur = pickToday(); applyParams(PARAMS); render(); }
async function start(){
  if(!D && ENC){
    const code = PARAMS.p || get("pc");
    if(!code){ lockScreen(); return; }
    try{ D = await decrypt(code); put("pc", code); }
    catch(e){ try{localStorage.removeItem("pc")}catch(_){}; lockScreen(PARAMS.p ? "This link's passcode is out of date. Enter the current one." : ""); return; }
  }
  start2();
}
start();
